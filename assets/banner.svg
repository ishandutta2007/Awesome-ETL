<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes flow1 {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flow2 {
      0% { stroke-dashoffset: -200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .flow-line {
      stroke-dasharray: 10, 15;
      animation: flow1 4s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 8, 12;
      animation: flow2 3s linear infinite;
    }
    .floating {
      animation: floatNode 4s ease-in-out infinite;
    }
    .floating-delay {
      animation: floatNode 4s ease-in-out infinite 2s;
    }
    .pulse-bg {
      animation: pulse 6s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="180" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)" class="pulse-bg" />
  <circle cx="1000" cy="180" r="140" fill="#c084fc" opacity="0.08" filter="url(#glow)" class="pulse-bg" />

  <!-- Dynamic Data Pipeline Flow Lines -->
  <g fill="none" stroke-width="2.5" opacity="0.7">
    <!-- Extract paths (Left to Center) -->
    <path d="M 120 100 C 220 100, 260 180, 360 180" stroke="#38bdf8" class="flow-line" />
    <path d="M 120 180 L 360 180" stroke="#818cf8" class="flow-line" />
    <path d="M 120 260 C 220 260, 260 180, 360 180" stroke="#c084fc" class="flow-line" />

    <!-- Transform paths (Center to Right) -->
    <path d="M 840 180 C 940 180, 980 100, 1080 100" stroke="#38bdf8" class="flow-line" />
    <path d="M 840 180 L 1080 180" stroke="#818cf8" class="flow-line" />
    <path d="M 840 180 C 940 180, 980 260, 1080 260" stroke="#c084fc" class="flow-line" />
  </g>

  <!-- Left Nodes (Extract / Sources) -->
  <g class="floating">
    <!-- Node 1: APIs / SaaS -->
    <g transform="translate(120, 100)">
      <circle r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#subtleGlow)" />
      <text fill="#38bdf8" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" dy="4">APIs</text>
    </g>
    <!-- Node 2: DB / CDC -->
    <g transform="translate(120, 180)">
      <circle r="28" fill="#1e293b" stroke="#818cf8" stroke-width="2.5" filter="url(#subtleGlow)" />
      <text fill="#818cf8" font-size="11" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" dy="4">CDC/DB</text>
    </g>
    <!-- Node 3: Streams / Events -->
    <g transform="translate(120, 260)">
      <circle r="28" fill="#1e293b" stroke="#c084fc" stroke-width="2.5" filter="url(#subtleGlow)" />
      <text fill="#c084fc" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" dy="4">STREAMS</text>
    </g>
  </g>

  <!-- Right Nodes (Load / Destinations) -->
  <g class="floating-delay">
    <!-- Node 4: Warehouses -->
    <g transform="translate(1080, 100)">
      <circle r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#subtleGlow)" />
      <text fill="#38bdf8" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" dy="4">DWH</text>
    </g>
    <!-- Node 5: Lakehouse -->
    <g transform="translate(1080, 180)">
      <circle r="28" fill="#1e293b" stroke="#818cf8" stroke-width="2.5" filter="url(#subtleGlow)" />
      <text fill="#818cf8" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" dy="4">LAKES</text>
    </g>
    <!-- Node 6: Analytics/BI -->
    <g transform="translate(1080, 260)">
      <circle r="28" fill="#1e293b" stroke="#c084fc" stroke-width="2.5" filter="url(#subtleGlow)" />
      <text fill="#c084fc" font-size="10" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" dy="4">AI / BI</text>
    </g>
  </g>

  <!-- Center Card (Awesome ETL) -->
  <g transform="translate(600, 180)" text-anchor="middle">
    <rect x="-240" y="-85" width="480" height="170" rx="16" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2" filter="url(#glow)" opacity="0.4" />
    <rect x="-236" y="-81" width="472" height="162" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

    <text y="-25" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="url(#accentGrad)" letter-spacing="1.5">
      ⚡ AWESOME ETL / ELT
    </text>

    <text y="12" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Curated Landscape of Modern Data Pipelines &amp; Integration
    </text>

    <g transform="translate(0, 48)">
      <rect x="-180" y="-14" width="76" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="-142" y="3" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">EXTRACT</text>

      <rect x="-90" y="-14" width="94" height="24" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="-43" y="3" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#818cf8">TRANSFORM</text>

      <rect x="18" y="-14" width="68" height="24" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
      <text x="52" y="3" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">LOAD</text>

      <rect x="100" y="-14" width="80" height="24" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1" />
      <text x="140" y="3" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">CDC &amp; OPS</text>
    </g>
  </g>
</svg>
